name: mobile_app
description: Mobile client for the intelligent waste sorting system.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  google_sign_in: ^6.1.0
  google_sign_in_web: ^0.12.4+4
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.0.0
  shared_preferences: ^2.3.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/en.json
    - assets/i18n/fr.json
